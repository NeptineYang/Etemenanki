name: 缺陷报告
description: 报告可复现的缺陷
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认已阅读 `DESIGN.md` 的已知限制与支持矩阵。涉及安全漏洞时不要在这里提交，改用 SECURITY.md 的私密渠道。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 取自“关于”页面或 Release 标签，例如 0.3.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 环境
      options:
        - Windows 11 x64，已安装 WSL2 环境包
        - Windows 11 x64，未安装 WSL2
        - 其他（请在复现步骤中说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 包含导入的项目类型、迁移方向、使用的模型接口
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附日志时请先删除密钥、源码片段与个人信息
    validations:
      required: true
