name: 功能建议
description: 提出新能力或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的具体阻碍，而不是先给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 迁移语义与支持矩阵
        - 依赖映射
        - 验证与报告
        - 界面与交互
        - 安装、更新与环境包
        - 其他
    validations:
      required: true
