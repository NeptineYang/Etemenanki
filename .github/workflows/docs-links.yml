name: 文档链接检查

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  internal:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # TODO 固定到提交 SHA，见 docs/process/ci.md §6
      - uses: actions/checkout@v4
      - name: 检查仓库内链接与锚点
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress "./**/*.md"
          fail: true

  external:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # TODO 固定到提交 SHA，见 docs/process/ci.md §6
      - uses: actions/checkout@v4
      - name: 检查外部链接
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 "./**/*.md"
          fail: true
